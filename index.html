<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Sign-up Form</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
</head>
<body>
  <div class="branding-container">
    <img src="./img/halie-west-unsplash-plant.jpg" alt="Ferns in the Washington forest" class="branding-image">
    <div class="logo-container">
      <img src="./img/odin-lined.png" alt="The Odin Project Logo" class="logo-image"><span class="logo-text">ODIN</span>
    </div>
    <div class="branding-image-credit">
      Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
      <a href="https://unsplash.com/">Unsplash</a>
    </div>
  </div>

  <div class="form-container">
    <form class="form">
      <div class="form-text">
        <p class="large">
          This is not a real online service!
          You know you need something like this in your life to help you realize your deepest dreams.
          Sign up <em>now</em> to get started.
        </p>

        <p class="large">
          You <em>know</em> you want to.
        </p>
      </div>

      <div class="form-fields">
        <p class="large">Let’s do this!</p>

        <label for="first-name">First name</label>
        <input type="text" id="first-name" name="first_name">

        <label for="last-name">Last name</label>
        <input type="text" id="last-name" name="last_name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="phone-number">Phone number</label>
        <input type="tel" id="phone-number" name="phone_number">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm_password">
      </div>

      <div class="form-text">
        <button type="submit" class="submit">Create Account</button>

        <p>Already have an account? <a href="">Log in</a></p>
      </div>
    </form>
  </div>
</body>
</html>
